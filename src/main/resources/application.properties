server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.serialization.fail-on-empty-beans=false
# Incluye el mensaje de ResponseStatusException en el JSON de error (la PWA lo muestra)
server.error.include-message=always
# Orígenes desde los que la PWA puede llamar a /api/** (patrones separados por coma)
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
