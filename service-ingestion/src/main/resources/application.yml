server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: service-ingestion
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  workers:
    urls: ${WORKER_URLS:http://localhost:8082,http://localhost:8083}
  storage:
    url: ${STORAGE_SERVICE_URL:http://localhost:8085}
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:distrifourier-wavs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

