server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  services:
    ingestion-url: ${INGESTION_SERVICE_URL:http://localhost:8081}
    storage-url: ${STORAGE_SERVICE_URL:http://localhost:8085}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

